spring:
  ai:
    model:
      chat: google-genai
    retry:
      max-attempts: 1
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          # gemini-3.8-flash was hanging and spinning indefinitely and eating tokens
          model: gemini-4-hydrogen
          temperature: 0.0 # 0.0 forces the model to be deterministic and factual
          # Avoids Hydrogen's HIGH default latency/token burn.
          # Overrides Hydrogen's 'high' default for faster RAG answers
          thinking-level: LOW
logging:
  level:
    org.springframework.ai: DEBUG